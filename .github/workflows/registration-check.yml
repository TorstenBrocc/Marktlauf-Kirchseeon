name: Registration Check

# Prueft, ob die eingebetteten RaceResult-Anmeldeformulare noch funktionieren.
# Hintergrund: Der Uptime-Check misst nur den HTTP-Status der eigenen Seiten (200).
# Der RaceResult-Aufruf laeuft clientseitig per XHR — ein 404 dort (z. B. nach
# Umbenennen der Registrierung im Backend) bleibt fuer den Uptime-Check unsichtbar.
# Dieser Workflow ruft denselben Endpoint direkt auf und alarmiert bei != 200.
#
# Quelle der Wahrheit sind die eingebetteten Snippets selbst — rname/key/eventid
# werden aus den Live-Dateien extrahiert, nicht hier hartkodiert. So testet der
# Check immer exakt das, was die Website an RaceResult schickt.
#
# Nach dem Anmeldeschluss antwortet RaceResult planmaessig mit HTTP 400
# ("Die Online-Anmeldung ist beendet") — das ist kein Ausfall. Der Check liest
# den Schluss deshalb aus derselben Konstante, nach der sich auch die Website
# umschaltet (ANMELDESCHLUSS in index.html), und schlaeft danach von selbst ein.
# Eine Wahrheitsquelle: wer den Schluss verschiebt, aendert nur index.html.

on:
  schedule:
    - cron: '*/15 * * * *'   # alle 15 Minuten
  workflow_dispatch:          # manuell ausloesbar
    inputs:
      test_alert:
        description: 'Absichtlich fehlschlagen (Test der Fehler-Benachrichtigung)'
        type: boolean
        default: false

jobs:
  check:
    name: RaceResult-Registrierungen erreichbar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Anmeldeformulare pruefen
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            echo "::error::Test-Alarm — absichtlicher Fehlschlag zur Pruefung der Benachrichtigung."
            exit 1
          fi

          # Anmeldeschluss aus index.html — dieselbe Konstante, nach der die Seite umschaltet.
          schluss=$(grep -oE "ANMELDESCHLUSS = new Date\('[^']+'\)" index.html \
            | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ -z "$schluss" ]; then
            echo "::error::ANMELDESCHLUSS in index.html nicht gefunden — Umschalt-Skript umgebaut?"
            exit 1
          fi
          schluss_ts=$(date -d "$schluss" +%s 2>/dev/null) || {
            echo "::error::ANMELDESCHLUSS \"$schluss\" ist kein lesbares Datum."
            exit 1
          }
          if [ "$(date +%s)" -ge "$schluss_ts" ]; then
            echo "Anmeldeschluss $schluss ist vorbei — Online-Anmeldung planmaessig geschlossen."
            echo "Nichts zu pruefen. Der Check wacht von selbst wieder auf, wenn"
            echo "ANMELDESCHLUSS in index.html auf einen kuenftigen Zeitpunkt zeigt."
            exit 0
          fi
          echo "Anmeldung offen bis $schluss — pruefe die Formulare."

          # "Anzeigename:Datei" — je Registrierung eine eingebettete Snippet-Datei.
          forms=(
            "Einzelanmeldung:index.html"
            "Sammelanmeldung:anmeldung-familie.php"
          )
          fail=0
          for entry in "${forms[@]}"; do
            label="${entry%%:*}"
            file="${entry##*:}"
            eid=$(grep -oE 'RRReg_eventid="[^"]+"' "$file"  | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            name=$(grep -oE 'RRReg_name="[^"]+"' "$file"    | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            key=$(grep -oE 'RRReg_key="[^"]+"' "$file"      | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

            if [ -z "$eid" ] || [ -z "$name" ] || [ -z "$key" ]; then
              echo "::error::$label ($file): RRReg_-Konfiguration nicht gefunden — Snippet umgebaut?"
              fail=1
              continue
            fi

            code=$(curl -s -o /dev/null -w "%{http_code}" -m 25 -X POST -G \
              --data-urlencode "eventid=$eid" \
              --data-urlencode "rname=$name" \
              --data-urlencode "key=$key" \
              --data-urlencode "lang=de-de" \
              "https://events2.raceresult.com/api/registrations/request" || echo "000")

            echo "$label ($name) -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$label: RaceResult lieferte HTTP $code fuer \"$name\" (erwartet 200)"
              fail=1
            fi
          done
          exit $fail

      - name: Push-Benachrichtigung bei Ausfall (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "kein NTFY_TOPIC gesetzt - uebersprungen"; exit 0; fi
          curl -s \
            -H "Title: ⚠️ ALARM 🚨" \
            -H "Priority: high" \
            -d "Anmeldung Marktlauf defekt
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" >/dev/null && echo "ntfy gesendet"
