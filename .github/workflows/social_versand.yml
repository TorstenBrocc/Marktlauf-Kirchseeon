name: Social-Auto-Versand (beste Sendezeit)

# "Beste Sendezeit"-Timer (Spec social-auto-versand-beste-zeit-spec.md §4b): laeuft STUENDLICH und
# macht je Lauf zwei Dinge — (1) terminierte Posts, deren Slot erreicht ist, live schalten +
# "erste-Stunde"-Mail; (2) faellige Opt-in-Posts (auto_versand=1) fuer ihren besten FB-Slot nativ
# terminieren (Meta scheduled_publish_time), Catch-up sofort. Instagram laeuft ueber den
# Meta-Business-Handoff, nicht ueber diesen Timer. Wie sponsor_versand.yml ueber SSH, weil
# Strato-Shared-Hosting kein crontab per SSH bietet; das CLI sichert sich per GET_LOCK gegen
# ueberlappende Laeufe (Cron + manueller Lauf senden nie doppelt).
#
# Hinweis: geplante Workflows starten unter Last evtl. verzoegert (deshalb der 15-Min-Vorlauf-Puffer
# im Script) und werden nach 60 Tagen Repo-Inaktivitaet deaktiviert (wie Uptime-Check).

on:
  schedule:
    - cron: '0 4-20 * * *'   # stuendlich 04:00-20:00 UTC ~ 06:00-22:00 CEST
  workflow_dispatch:         # manuell im Actions-Tab ausloesbar (Erst-Test)

# Nur ein Lauf gleichzeitig — zweiter wartet, statt parallel zu senden.
concurrency:
  group: social-versand
  cancel-in-progress: false

jobs:
  auto-versand:
    name: Faellige Auto-Posts senden
    runs-on: ubuntu-latest
    steps:
      - name: CLI-Versand per SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          key: ${{ secrets.SFTP_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.SFTP_REMOTE_PATH }}
            MARKTLAUF_CLI=1 /bin/php bin/social_versand.php
