name: PHP Lint

on:
  push:
    branches:
      - main
      - 'claudex/**'
  pull_request:

jobs:
  php-lint:
    name: php -l
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Syntax check all PHP files
        run: |
          find . -type d \( -name vendor -o -name venv -o -name node_modules -o -name .git \) -prune \
            -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      # bin/-Skripte laufen teils über GitHub Actions; ihr stdout steht im Actions-Log, das im
      # öffentlichen Repo jeder angemeldete GitHub-Nutzer lesen kann (Befund 2026-10-07).
      # Ausgaben laufen über cliAusgabe() in src/logger.php und nennen nur IDs und Zähler.
      - name: Keine E-Mail-Adressen in CLI-Ausgaben
        run: |
          if grep -nE "(echo|print|printf|cliAusgabe)\b.*\[['\"]email['\"]\]" bin/*.php; then
            echo "::error::CLI-Ausgabe mit E-Mail-Adresse in bin/ — nur IDs ausgeben (siehe cliAusgabe in src/logger.php)."
            exit 1
          fi
