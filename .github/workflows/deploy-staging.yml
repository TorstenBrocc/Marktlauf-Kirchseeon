name: Staging Deployment (Buehne S)

# Deployt Claudex-Branches (claudex/**) per rsync in den STAGING-Ordner auf Strato und
# faehrt dort offene Migrationen automatisch (die Staging-DB ist Wegwerfware — anders als
# Prod, wo migrate.yml bewusst manuell bleibt). Prod (main -> deploy.yml) bleibt unberuehrt.
#
# Sicherheitsnetz: Ziel kommt aus dem EIGENEN Secret SFTP_REMOTE_PATH_STAGING; der Guard
# bricht ab, wenn es leer ist oder auf den Prod-Ordner "Homepage" zeigt.
# Zugangsschutz: storage/htaccess.staging (Basic-Auth + noindex) wird nach jedem rsync
# VOR die Repo-.htaccess gesetzt — die Buehne ist nie ohne Login erreichbar.

on:
  push:
    branches:
      - 'claudex/**'
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  staging-deploy:
    name: Deploy nach Staging
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Guard — Zielpfad muss Staging sein
      env:
        TARGET: ${{ secrets.SFTP_REMOTE_PATH_STAGING }}
      run: |
        if [ -z "$TARGET" ]; then echo "SFTP_REMOTE_PATH_STAGING fehlt"; exit 1; fi
        case "$TARGET" in *Homepage*) echo "Zielpfad zeigt auf Prod (Homepage) — Abbruch"; exit 1;; esac
        case "$TARGET" in *Staging*) echo "Ziel ok";; *) echo "Zielpfad enthaelt nicht 'Staging' — Abbruch"; exit 1;; esac

    - name: Stamp asset versions (cache-busting)
      run: |
        V="${GITHUB_SHA::8}"
        for f in *.html; do
          [ -e "$f" ] || continue
          sed -i \
            -e "s|href=\"css/base.css\"|href=\"css/base.css?v=$V\"|g" \
            -e "s|href=\"css/layout.css\"|href=\"css/layout.css?v=$V\"|g" \
            -e "s|href=\"css/components.css\"|href=\"css/components.css?v=$V\"|g" \
            -e "s|src=\"js/main.js\"|src=\"js/main.js?v=$V\"|g" \
            -e "s|src=\"js/maps.js\"|src=\"js/maps.js?v=$V\"|g" \
            -e "s|src=\"js/consent.js\"|src=\"js/consent.js?v=$V\"|g" \
            "$f"
        done
        sed -i "s|/lang/\${lang}.json|/lang/\${lang}.json?v=$V|g" js/main.js

    - name: SSH Deploy (Staging)
      uses: easingthemes/ssh-deploy@v5.1.0
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SFTP_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.SFTP_HOST }}
        REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
        TARGET: ${{ secrets.SFTP_REMOTE_PATH_STAGING }}
        SOURCE: "./"
        ARGS: "-rlgoDzvc -i --delete"
        # Wie Prod, plus die serverseitig gepflegten Staging-Dateien (Basic-Auth, Vorlage, Cache).
        EXCLUDE: ".git/, .github/, .claude/, .vscode/, node_modules/, .clinerules, .memory/, .gitignore, .DS_Store, storage/config.php, storage/files/, storage/logs/, storage/cache/, storage/.htpasswd, storage/.staging-basic-auth.txt, storage/htaccess.staging, data/status.json, data/sponsoren.json, .user.ini, .env, venv/, tests/, intern/, README.md, THIRD-PARTY-NOTICES.md, assets/social/, assets/sponsoren-live/"

    - name: Zugangsschutz voranstellen + Migrationen fahren
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        key: ${{ secrets.SFTP_SSH_KEY }}
        command_timeout: 15m
        script: |
          set -e
          cd "${{ secrets.SFTP_REMOTE_PATH_STAGING }}"
          test -f storage/htaccess.staging || { echo "storage/htaccess.staging fehlt"; exit 1; }
          { cat storage/htaccess.staging; echo; cat .htaccess; } > .htaccess.tmp && mv .htaccess.tmp .htaccess
          echo "== .htaccess: Basic-Auth vorangestellt =="; head -3 .htaccess
          echo "== Migrationen (Staging) =="
          MARKTLAUF_CLI=1 /bin/php bin/migrate.php status
          MARKTLAUF_CLI=1 /bin/php bin/migrate.php migrate
          MARKTLAUF_CLI=1 /bin/php bin/migrate.php status
